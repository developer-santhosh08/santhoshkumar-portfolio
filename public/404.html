<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space | Santhosh Kumar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #a855f7;
            --accent-color-rgb: 168, 85, 247;
            --bg-color: #050508;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        .error-code {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(8rem, 20vw, 15rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(to bottom, #fff, rgba(255,255,255,0.1));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            position: relative;
            animation: float 6s ease-in-out infinite;
        }

        .error-code::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            background: transparent;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(var(--accent-color-rgb), 0.5);
            z-index: -1;
            filter: blur(20px);
        }

        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.6);
            max-width: 500px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            padding: 18px 45px;
            background: var(--accent-color);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 15px 35px rgba(var(--accent-color-rgb), 0.4);
        }

        .home-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 50px rgba(var(--accent-color-rgb), 0.6);
            background: #fff;
            color: #000;
        }

        /* Background Effects */
        .aurora {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(var(--accent-color-rgb), 0.08) 0%, transparent 40%);
            z-index: 1;
            animation: rotate 20s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Scanline effect */
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 5;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 6s linear infinite;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            80% { bottom: 100%; }
            100% { bottom: -100%; }
        }
    </style>
</head>
<body>
    <div class="aurora"></div>
    <div class="scanline"></div>

    <div class="container">
        <div class="error-code">404</div>
        <h1>Lost in the Void</h1>
        <p>The page you are looking for has been moved or doesn't exist in this universe.</p>
        <a href="/" class="home-btn">Return to Safety</a>
    </div>
    <script>
        // Sync theme with main app
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
        }

        const savedColor = localStorage.getItem('accentColor') || '#a855f7';
        document.documentElement.style.setProperty('--accent-color', savedColor);
        
        const rgb = hexToRgb(savedColor);
        if (rgb) {
            document.documentElement.style.setProperty('--accent-color-rgb', rgb);
        }
    </script>
</body>
</html>
